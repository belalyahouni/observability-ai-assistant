apiVersion: apps/v1
kind: Deployment
metadata:
  name: content-service
  labels:
    app: content-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: content-service
  template:
    metadata:
      labels:
        app: content-service
    spec:
      containers:
        - name: content-service
          image: obs-content-service:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8000
          env:
            - name: RECOMMENDATION_SERVICE_URL
              value: "http://recommendation-service:8000"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://otel-collector:4317"
            - name: FAULT_ENABLED
              value: "false"
            - name: FAULT_LATENCY_MS
              value: "0"
            - name: FAULT_ERROR_RATE
              value: "0.0"
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: content-service
spec:
  selector:
    app: content-service
  ports:
    - port: 8000
      targetPort: 8000
